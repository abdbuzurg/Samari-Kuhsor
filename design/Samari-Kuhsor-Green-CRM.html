<style>
/* Modernist — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap');

:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #ec3013;
  --color-accent-2: #e15b47;
  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #fff2ef;
  --color-accent-200: #ffe0d9;
  --color-accent-300: #ffc4b8;
  --color-accent-400: #ff9783;
  --color-accent-500: #ff563c;
  --color-accent-600: #dd2b0f;
  --color-accent-700: #ae1800;
  --color-accent-800: #7c1405;
  --color-accent-900: #4d170e;

  --color-accent-2-100: #fff2ef;
  --color-accent-2-200: #ffe0da;
  --color-accent-2-300: #ffc4b9;
  --color-accent-2-400: #ff9784;
  --color-accent-2-500: #ef6853;
  --color-accent-2-600: #c94b39;
  --color-accent-2-700: #9e3526;
  --color-accent-2-800: #71261b;
  --color-accent-2-900: #471d16;

  --font-heading: "Archivo", system-ui, sans-serif;
  --font-heading-weight: 800;
  --font-body: "Archivo", system-ui, sans-serif;

  --space-1: 4.0px;
  --space-2: 8.0px;
  --space-3: 12.0px;
  --space-4: 16.0px;
  --space-6: 24.0px;
  --space-8: 32.0px;

  --radius-sm: 0px;
  --radius-md: 0px;
  --radius-lg: 0px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.grayscale{filter:grayscale(1) contrast(1.08)}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 2px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: 2px solid var(--color-divider);
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid var(--color-divider);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }


</style>
<style>
:root{
  --color-accent: #1f7a3d;
  --color-accent-2: #3d8a55;
  --color-accent-100: #eff8f1;
  --color-accent-200: #d6ecdc;
  --color-accent-300: #b0dcbd;
  --color-accent-400: #75c191;
  --color-accent-500: #35a35f;
  --color-accent-600: #1f7a3d;
  --color-accent-700: #175c2e;
  --color-accent-800: #124524;
  --color-accent-900: #10301b;
  --color-accent-2-100: #f0f7f2;
  --color-accent-2-200: #d9ebde;
  --color-accent-2-300: #b6dcc1;
  --color-accent-2-400: #82c397;
  --color-accent-2-500: #4ea56d;
  --color-accent-2-600: #3d8a55;
  --color-accent-2-700: #2e6a41;

}

</style>
<style>

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased}
  .muted{color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .sk-ic{display:inline-flex;align-items:center;justify-content:center;line-height:0;color:currentColor}
  .sk-ic svg{width:1em;height:1em;display:block}
  .sk-ic .ph{font-size:inherit}
  .sk-app{display:grid;grid-template-columns:252px 1fr;height:100vh;overflow:hidden}

  /* Sidebar */
  .sk-side{display:flex;flex-direction:column;min-height:0;background:var(--color-surface);border-right:1px solid var(--color-divider)}
  .sk-brand{display:flex;align-items:center;gap:var(--space-3);height:64px;flex:none;padding:0 var(--space-4);border-bottom:1px solid var(--color-divider)}
  .sk-brand-mark{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-weight:var(--font-heading-weight);border-radius:var(--radius-sm);font-size:15px}
  .sk-brand-name{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:15px;line-height:1.15}
  .sk-brand-sub{font-size:11px;margin-top:1px}
  .sk-nav{flex:1;min-height:0;overflow-y:auto;padding:var(--space-1) var(--space-2) var(--space-2);display:flex;flex-direction:column;gap:1px}
  .sk-navgroup{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:var(--space-3) var(--space-2) var(--space-1)}
  .sk-navitem{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;color:var(--color-text);text-decoration:none;border-left:3px solid transparent;transition:background .12s}
  .sk-navitem .sk-ic{font-size:17px;color:color-mix(in srgb,var(--color-text) 62%,transparent)}
  .sk-navitem:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
  .sk-navitem.active{background:color-mix(in srgb,var(--color-accent) 13%,transparent);border-left-color:var(--color-accent);font-weight:600}
  .sk-navitem.active .sk-ic{color:var(--color-accent)}
  .sk-navcount{margin-left:auto;font-size:10.5px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--color-text) 10%,transparent);font-feature-settings:'tnum'}
  .sk-navitem.active .sk-navcount{background:var(--color-accent);color:var(--color-bg)}
  .sk-side-foot{padding:var(--space-3) var(--space-4);border-top:1px solid var(--color-divider);font-size:11px;display:flex;align-items:center;gap:var(--space-2)}
  .sk-dot{width:7px;height:7px;border-radius:999px;background:var(--color-accent-2);flex:none}

  /* Main */
  .sk-main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .sk-top{display:flex;align-items:center;gap:var(--space-3);height:64px;flex:none;padding:0 var(--space-4);border-bottom:1px solid var(--color-divider);background:var(--color-bg);position:relative;z-index:20}
  .sk-search{flex:1;max-width:440px;position:relative}
  .sk-search .sk-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;font-size:16px;color:color-mix(in srgb,var(--color-text) 45%,transparent);pointer-events:none}
  .sk-search .input{padding-left:38px}
  .sk-top-actions{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
  .sk-langseg .seg-opt{padding:6px 10px;font-size:12px}
  .sk-user{display:flex;align-items:center;gap:var(--space-2);padding:4px 6px 4px 4px;border:1px solid var(--color-divider);border-radius:999px;cursor:pointer;background:transparent}
  .sk-user:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent)}
  .sk-ava{width:30px;height:30px;border-radius:999px;flex:none;display:grid;place-items:center;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:12px}
  .sk-user-name{font-size:12.5px;line-height:1.1;font-weight:600}
  .sk-user-role{font-size:10.5px}
  .sk-iconwrap{position:relative}
  .sk-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--color-accent);color:var(--color-bg);font-size:10px;display:grid;place-items:center;font-feature-settings:'tnum';border:2px solid var(--color-bg)}
  .sk-content{flex:1;min-height:0;overflow-y:auto;padding:var(--space-4)}

  /* Popovers */
  .sk-pop{position:absolute;top:calc(100% + 8px);right:0;width:320px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);z-index:40;overflow:hidden}
  .sk-pop.sk-menu{width:200px}
  .sk-pop-hd{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3);border-bottom:1px solid var(--color-divider)}
  .sk-pop-hd b{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:14px}
  .sk-menu-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);font-size:13px;cursor:pointer}
  .sk-menu-item:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
  .sk-menu-item + .sk-menu-item{border-top:1px solid var(--color-divider)}
  .sk-notif{max-height:360px;overflow-y:auto}
  .sk-notif-item{display:flex;gap:var(--space-3);padding:var(--space-3);border-bottom:1px solid var(--color-divider);cursor:pointer}
  .sk-notif-item:hover{background:color-mix(in srgb,var(--color-text) 5%,transparent)}
  .sk-notif-ic{width:30px;height:30px;flex:none;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--color-accent) 14%,transparent);color:var(--color-accent)}
  .sk-notif-ic.ok{background:color-mix(in srgb,var(--color-accent-2) 16%,transparent);color:var(--color-accent-2-700)}
  .sk-notif-t{font-size:12.5px;line-height:1.35}
  .sk-notif-s{font-size:11px;margin-top:2px}

  /* Page */
  .sk-pagehd{display:flex;align-items:flex-end;gap:var(--space-4);margin-bottom:var(--space-4);flex-wrap:wrap}
  .sk-pagehd > div:first-child{flex:1 1 auto;min-width:0}
  .sk-kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent)}
  .sk-title{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:27px;line-height:1.05;margin:3px 0 0;letter-spacing:-.01em}
  .sk-pagehd-actions{margin-left:auto;display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}

  .sk-kpis{display:grid;gap:var(--space-3);margin-bottom:var(--space-4)}
  .sk-kpi{gap:6px}
  .sk-kpi-label{font-size:11px;line-height:1.3}
  .sk-kpi-value{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:24px;line-height:1;font-feature-settings:'tnum'}
  .sk-kpi-delta{font-size:11px;display:flex;align-items:center;gap:4px}
  .sk-kpi-delta .sk-ic{font-size:13px}
  .up{color:var(--color-accent-2-700)} .down{color:var(--color-accent)}

  .sk-grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:var(--space-3);margin-bottom:var(--space-4)}
  .sk-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-bottom:var(--space-4)}
  .sk-cardhd{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-3)}
  .sk-cardtitle{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:15px}

  /* Chart */
  .sk-chart{display:flex;align-items:stretch;gap:var(--space-2);height:196px}
  .sk-barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px}
  .sk-bars{display:flex;align-items:flex-end;gap:4px;height:158px}
  .sk-bar{width:13px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:height .4s cubic-bezier(.2,.7,.3,1)}
  .sk-bar.rev{background:var(--color-accent)}
  .sk-bar.ord{background:color-mix(in srgb,var(--color-accent-2) 62%,var(--color-surface))}
  .sk-barlbl{font-size:10.5px}
  .sk-legend{display:flex;gap:var(--space-3);font-size:11px}
  .sk-legend span{display:inline-flex;align-items:center;gap:6px}
  .sk-swatch{width:10px;height:10px;border-radius:2px;display:inline-block}

  /* Pipeline */
  .sk-pipe{display:flex;flex-direction:column;gap:13px}
  .sk-piperow{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:var(--space-2);font-size:12.5px}
  .sk-pipetrack{height:11px;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--color-text) 9%,transparent)}
  .sk-pipefill{height:100%;background:var(--color-accent);border-radius:999px;transition:width .5s}
  .sk-pipeval{text-align:right;font-feature-settings:'tnum';font-weight:600}

  /* Lists */
  .sk-list{display:flex;flex-direction:column}
  .sk-li{display:flex;align-items:center;gap:var(--space-3);padding:9px 0;border-bottom:1px solid var(--color-divider)}

/* ===== green chrome + semantic status palette ===== */
:root{

.tag-ok{background:color-mix(in srgb,var(--sk-ok) 15%,transparent);color:var(--sk-ok-t);border:1px solid color-mix(in srgb,var(--sk-ok) 32%,transparent)}

  function dialogHTML(){
    var t=L();
    return '<div class="dialog-backdrop sk-hide" id="sk-dialog"><div class="dialog"><div class="dialog-title">'+t.newRecord+'</div><div class="dialog-body"><p class="muted" style="margin-top:0">'+t.dlgHint+'</p><div class="sk-formrow"><div class="field"><label>'+t.ftName+'</label><input class="input" placeholder="—"></div><div class="field"><label>'+t.ftOwner+'</label><input class="input" value="'+t.user+'"></div></div><div class="sk-formrow" style="margin-top:12px"><div class="field"><label>'+t.ftType+'</label><input class="input" placeholder="—"></div><div class="field"><label>'+t.ftAmount+'</label><input class="input" placeholder="0 c."></div></div></div><div class="dialog-actions"><button class="btn btn-secondary" data-act="dlg-close">'+t.cancel+'</button><button class="btn btn-primary" data-act="dlg-save">'+t.save+'</button></div></div></div>';
  }

  /* ---------- render ---------- */
  function render(){
    var main=st.mod==='dashboard'?dashboard():moduleView(st.mod);
    app.innerHTML=shell(main);
    paintIcons();
  }
  function rerenderContent(){
    document.getElementById('sk-content').innerHTML=st.mod==='dashboard'?dashboard():moduleView(st.mod);
    paintIcons();
  }
  function rerenderTop(){document.querySelector('.sk-top').innerHTML=topHTML();paintIcons();}

  function toast(msg){
    var w=document.getElementById('toasts');
    var el=document.createElement('div');el.className='sk-toast';el.innerHTML=icon('check',16)+'<span>'+msg+'</span>';
    w.appendChild(el);paintIcons();
    setTimeout(function(){el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(function(){el.remove();},300);},2400);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]'); 
    var t=L();
    // close popovers when clicking outside
    if(!e.target.closest('.sk-iconwrap')&&(st.notif||st.menu)){st.notif=false;st.menu=false;rerenderTop();}
    if(!el)return;
    var a=el.dataset.act;
    if(a==='nav'){st.mod=el.dataset.mod;st.query='';st.notif=false;st.menu=false;render();return;}
    if(a==='lang'){st.lang=el.dataset.lang;render();return;}
    if(a==='period'){st.period=el.dataset.period;rerenderContent();return;}
    if(a==='notif'){st.notif=!st.notif;st.menu=false;rerenderTop();return;}
    if(a==='menu'){st.menu=!st.menu;st.notif=false;rerenderTop();return;}
    if(a==='markall'){st.notifCount=0;st.notif=false;rerenderTop();toast('Все уведомления отмечены прочитанными');return;}
    if(a==='notif-go'){st.notif=false;st.mod='website';render();return;}
    if(a==='create'){document.getElementById('sk-dialog').classList.remove('sk-hide');return;}
    if(a==='dlg-close'){document.getElementById('sk-dialog').classList.add('sk-hide');return;}
    if(a==='dlg-save'){document.getElementById('sk-dialog').classList.add('sk-hide');toast('Запись сохранена');return;}
    if(a==='export'){toast('Экспорт в Excel подготовлен');return;}
    if(a==='toast-filter'){toast('Панель фильтров');return;}
    if(a==='toast-settings'){toast('Настройки системы');return;}
    if(a==='toast-profile'){st.menu=false;rerenderTop();toast('Профиль пользователя');return;}
    if(a==='toast-logout'){st.menu=false;rerenderTop();toast('Выход из системы…');return;}
  });
  document.addEventListener('input',function(e){
    if(e.target.id==='sk-search'||e.target.id==='sk-search2'){st.query=e.target.value;
      // update only the table/content without losing focus if possible: re-render content then refocus
      var id=e.target.id, pos=e.target.selectionStart;
      rerenderContent();
      var n=document.getElementById(id); if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}
    }
  });

  function boot(){render();}
  var t0=Date.now();
  (function w(){
    var cssReady=(window.__dsLink&&window.__dsLink.sheet)||window.__dsReady||(Date.now()-t0>1600);
    var icReady=(CFG.icons!=='lucide')||window.lucide||(Date.now()-t0>1600);
    if(cssReady&&icReady){boot();}else{setTimeout(w,30);}
  })();
})();

</script>
</body>
</html>
