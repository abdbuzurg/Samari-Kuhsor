# Generates packages/types from the Go DTOs in internal/api.
#
# The Go types are the source of truth (docs/07-IMPLEMENTATION-PLAN.md I3).
# `make check` regenerates and fails on a non-empty git diff, so the TypeScript
# cannot drift from the Go -- the silent bug 03-API-CONTRACT.md:265 warns about.
packages:
  - path: "github.com/qoim/samari/backend/internal/api"
    output_path: "../packages/types/api.ts"
    type_mappings:
      # Money and quantities cross the wire as strings, never numbers: a JSON
      # number becomes a float64 in every JavaScript client and floats corrupt
      # currency (03-API-CONTRACT.md:147). The TS type must say so.
      common.Money: "string"
      common.Quantity: "string"
    frontmatter: |
      /* eslint-disable */
      /**
       * GENERATED by `make tygo` from backend/internal/api. DO NOT EDIT.
       *
       * The Go types are the single source of truth for the API contract
       * (docs/07-IMPLEMENTATION-PLAN.md I3). `make check` fails if this file is
       * stale, which is what makes Go/TypeScript payload drift impossible --
       * docs/03-API-CONTRACT.md:265 calls that "the most likely silent bug in
       * this architecture".
       *
       * Money and quantity fields are typed `string` deliberately.
       */
